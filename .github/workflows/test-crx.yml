name: Publish CRX (Test)

on:
  workflow_dispatch:

jobs:
  build:
    name: Publish Chrome Extension (Test)
    runs-on: ubuntu-latest
    environment: chrome-extension-upload
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4.2.2
    - uses: actions/setup-node@v4.4.0
      with:
        node-version: 22
    - name: Prepare ZIP
      run: zip -r ./dist/extension.zip ./src
    - name: Upload ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: extension-zip
        path: ./dist/extension.zip
    - name: Publish to Chrome Web Store
      id: publish-chrome-extension
      uses: puzzlers-labs/chrome-webstore-publish@v1
      with:
        mode: publish
        publish_target: testers
        zip_file_path: ./dist/extension.zip
        extension_id: ${{ secrets.EXTENSION_ID }}
        client_id: ${{ secrets.CLIENT_ID }}
        client_secret: ${{ secrets.CLIENT_SECRET }}
        refresh_token: ${{ secrets.REFRESH_TOKEN }}
        crx_private_key: ${{ secrets.PEM }}
