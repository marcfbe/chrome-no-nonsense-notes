name: Publish CRX (Test)

on:
  workflow_dispatch:

jobs:
  build:
    name: Publish Chrome Extension (Test)
    runs-on: ubuntu-latest
    environment: chrome-extension-upload
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Prepare ZIP
      run: |
        cd src
        zip -r ../extension.zip .
    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: extension
        path: ./extension.zip
    - name: Publish to Chrome Web Store
      id: publish-chrome-extension
      uses: puzzlers-labs/chrome-webstore-publish@v1
      with:
        mode: publish
        publish_target: testers
        zip_file_path: ./extension.zip
        extension_id: ${{ secrets.EXTENSION_ID }}
        client_id: ${{ secrets.CLIENT_ID }}
        client_secret: ${{ secrets.CLIENT_SECRET }}
        refresh_token: ${{ secrets.REFRESH_TOKEN }}
        crx_private_key: ${{ secrets.PEM }}
